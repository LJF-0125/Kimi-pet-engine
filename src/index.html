<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>kimi-pet</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      box-sizing: border-box;
      transition: padding-top 0.18s ease; /* 弹跳前平滑腾出头顶空间 */
    }
    #pet {
      max-width: 100%;
      max-height: 100%;
      pointer-events: none; /* 鼠标事件由 stage 统一处理 */
      transition: transform 0.18s ease; /* 只露头隐藏时的旋转动画 */
    }
    #stage.offline #pet,
    #stage.offline #placeholder {
      filter: grayscale(1) opacity(0.45);
    }
    #placeholder {
      display: none;
      font-size: 64px;
      text-align: center;
      pointer-events: none;
    }
    /* 待审核提醒：跳两下歇一会儿的循环（挂在 stage 上，和 #pet 的旋转互不干扰） */
    @keyframes approval-hop {
      0%, 100% { transform: translateY(0); }
      8% { transform: translateY(-14px); }
      16% { transform: translateY(0); }
      24% { transform: translateY(-8px); }
      32% { transform: translateY(0); }
    }
    /* 弹跳时加 26px 头顶内边距：竖版 GIF 高度撑满窗口，没空间跳会被窗口上沿裁掉 */
    #stage.alert-hop {
      animation: approval-hop 1.8s ease-in-out infinite;
      padding-top: 26px;
    }
  </style>
</head>
<body>
  <div id="stage" data-tauri-drag-region>
    <img id="pet" alt="" draggable="false" />
    <div id="placeholder">🐾</div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const { openUrl } = window.__TAURI__.opener;

    // ---- IndexedDB：按状态名存 GIF 二进制（设置窗口写入，这里读取）----
    const STATES = ["thinking", "answering", "approval", "idle"];

    function idb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("kimi-pet", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("gifs");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbGet(key) {
      const db = await idb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("gifs", "readonly").objectStore("gifs").get(key);
        tx.onsuccess = () => resolve(tx.result || null);
        tx.onerror = () => reject(tx.error);
      });
    }

    // ---- 状态 -> GIF ----
    const stage = document.getElementById("stage");
    const pet = document.getElementById("pet");
    const placeholder = document.getElementById("placeholder");
    const urls = {}; // state -> objectURL
    let currentState = "idle";
    let offline = false;

    async function loadGifs() {
      for (const state of STATES) {
        let blob = await idbGet(state);
        if (!blob) {
          // 未上传过：回落到内置默认 GIF
          try {
            const resp = await fetch(`default-gifs/${state}.gif`);
            if (resp.ok) blob = await resp.blob();
          } catch (_) {}
        }
        if (urls[state]) URL.revokeObjectURL(urls[state]);
        urls[state] = blob ? URL.createObjectURL(blob) : null;
      }
      render();
    }

    function render() {
      const url = urls[currentState] || urls.idle;
      if (url) {
        pet.src = url;
        pet.style.display = "";
        placeholder.style.display = "none";
      } else {
        pet.style.display = "none";
        placeholder.style.display = "block";
      }
      stage.classList.toggle("offline", offline);
    }

    function applyState(state) {
      if (state === "offline") {
        offline = true;
      } else {
        offline = false;
        currentState = STATES.includes(state) ? state : "idle";
      }
      render();
      // 待审核提醒：按进入/离开的边沿触发
      const approval = state === "approval";
      if (approval !== wasApproval) {
        wasApproval = approval;
        if (approval) onApprovalStart();
        else onApprovalEnd();
      }
    }

    // ---- 待审核主动提醒：弹跳 + 探出隐藏 + 可选提示音；开关存 IndexedDB ----
    let wasApproval = false;
    let alertOn = true;
    let alertSound = false;

    async function applyAlertPrefs() {
      const a = await idbGet("alertApproval");
      const s = await idbGet("alertSound");
      alertOn = a === null ? true : !!a; // 默认开
      alertSound = s === null ? false : !!s; // 默认关
      if (!alertOn) stage.classList.remove("alert-hop");
    }
    listen("alert-updated", applyAlertPrefs);
    applyAlertPrefs();

    function onApprovalStart() {
      if (!alertOn) return;
      stage.classList.add("alert-hop");
      invoke("reveal_if_hidden"); // 藏着就探出来，没藏是空操作
      if (alertSound) chime();
      setTimeout(syncHeadRect, 200); // 内边距改变了图片位置，头框映射重算
    }

    function onApprovalEnd() {
      stage.classList.remove("alert-hop");
      setTimeout(syncHeadRect, 200);
      // 处理完后：鼠标不在宠物身上且没拖走（还停在边缘）→ 自动收回
      setTimeout(() => {
        if (!stage.matches(":hover")) invoke("try_rehide");
      }, 1500);
    }

    // 提示音：WebAudio 振荡器合成两声短嘀，不依赖音频文件
    let audioCtx = null;
    function chime() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        for (const t of [0, 0.2]) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime + t);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.15);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + t);
          osc.stop(audioCtx.currentTime + t + 0.16);
        }
      } catch (_) {}
    }

    // 设置窗口保存后刷新
    listen("gifs-updated", loadGifs);

    // ---- 大小缩放：比例存 IndexedDB（键 scale），由 Rust 端调整窗口实际尺寸 ----
    async function applyScale() {
      const scale = (await idbGet("scale")) || 1;
      invoke("set_scale", { scale });
    }
    listen("scale-updated", applyScale);
    applyScale();

    // ---- 贴边自动隐藏：模式存 IndexedDB（键 hideMode），同步给 Rust 端 ----
    async function applyHideMode() {
      let mode = await idbGet("hideMode");
      if (mode === null) {
        // 旧键 edgeHide（bool）迁移：false→关闭，其余→露出一条
        mode = (await idbGet("edgeHide")) === false ? "off" : "sliver";
      }
      invoke("set_hide_mode", { mode });
    }
    listen("edge-hide-updated", applyHideMode);
    applyHideMode();
    // 悬停唤回；离开后没拖走、还停在边缘 → 600ms 后自动重新隐藏
    // （拖动中不打断由 Rust 端按 Moved 事件判断：原生拖动结束时 mouseup 不会回传页面）
    let rehideTimer = null;
    stage.addEventListener("mouseenter", () => {
      clearTimeout(rehideTimer);
      invoke("reveal_if_hidden");
    });
    stage.addEventListener("mouseleave", () => {
      clearTimeout(rehideTimer);
      rehideTimer = setTimeout(() => invoke("try_rehide"), 600);
    });

    // ---- 只露头的头框：IndexedDB 存图片相对坐标（键 headRect:<state>），
    //      换算成窗口相对坐标后同步给 Rust（旋转由 Rust 按隐藏方向决定）----
    async function syncHeadRect() {
      if (!pet.complete || !pet.naturalWidth) return; // 图片未就绪，等 load 事件再触发
      // 头框跟着实际显示的图走：当前状态无图时显示的是 idle
      const displayed = urls[currentState] ? currentState : "idle";
      const rect = await idbGet("headRect:" + displayed);
      if (!rect) {
        invoke("set_head_rect", { rect: null });
        return;
      }
      const ib = pet.getBoundingClientRect();
      const sb = stage.getBoundingClientRect();
      if (!ib.width || !sb.width) return;
      invoke("set_head_rect", {
        rect: {
          x: (ib.left - sb.left + rect.x * ib.width) / sb.width,
          y: (ib.top - sb.top + rect.y * ib.height) / sb.height,
          w: (rect.w * ib.width) / sb.width,
          h: (rect.h * ib.height) / sb.height,
        },
      });
    }
    pet.addEventListener("load", syncHeadRect);
    listen("head-rect-updated", syncHeadRect);

    // Rust 在隐藏/滑回动画起点发的事件：只露头时旋转画面，让身体朝向屏幕外被边框
    // 挡住（左 90° / 右 270° / 顶 180°）；滑回时转正
    listen("edge-hide", (e) => {
      if (e.payload.hidden) {
        pet.style.transform = e.payload.rotate ? `rotate(${e.payload.rotate}deg)` : "";
      } else {
        pet.style.transform = "";
      }
    });

    // ---- 交互：拖动（data-tauri-drag-region）、双击开 web、右键开设置 ----
    stage.addEventListener("dblclick", async () => {
      const url = await invoke("web_url");
      if (url) await openUrl(url);
    });
    stage.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      invoke("open_settings");
    });

    loadGifs();
    // listen 注册完成后主动拉一次当前状态，补上注册前可能丢掉的 emit
    listen("pet-state", (e) => applyState(e.payload)).then(() => {
      invoke("get_state").then(applyState);
    });
  </script>
</body>
</html>
